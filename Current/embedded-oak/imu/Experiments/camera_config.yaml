# Frame rate for all camera streams (color and mono camera nodes)
fps: 10

# Frame rate for running 3A algorithms (auto-focus, auto-exposure, and auto-white-balance) for all camera streams, Default (0) matches the camera FPS
fps_3a: 0

# Enable or disable debugging to print information about CPU/RAM consumption, temperature, CMX slices and SHAVE core allocation
debug: False

# Adding manual timeout 
timeout: 10

# Path for camera tuning blob file
camera_tuning_blob: "camera_blob/camera_tuning_blob.bin"

# Pipeline to be uploaded to camera
pipeline: "imu_pipeline"
# Pipeline for data collection, fetching color, depth and/or mono frames from camera
data_pipeline:
    RGB:
        # dimensions for preview output of ColorCamera
        preview: !!seq
            - 1024
            - 1024
        # dimensions for video output of ColorCamera
        video: !!seq
            - 2048
            - 2048
        # define how the output from ColorCamera should be obtained
        xout:
            # source of output stream (video, preview)
            input: "video"
            # enable/disable encoding of output (preview is not readily encodable because of its data type)
            encode: True
            # enable/disable control over frequency at which output is provided (if control is not needed time_gap should be 0, unit is in seconds)
            time_gap: 0
        
    Mono:
        # Link output of MonoCameras to host computer
        xout: False
        # enable/disable encoding of MonoCamera output
        encode: False
        # control rate of frames at camera level
        time_gap: 0
        
    Depth:
        # enable/disable Subpixel Disparity mode for StereoDepth node
        subpixel: False
        # switch between fetching "disparity" or "depth" output, False for "depth", True for "disparity"
        disparity: False

    IMU:
        freq: 25

# Pipeline for running segmentation neural net on board the camera, depth and/or mono frames from camera
segmentation_pipeline:
    RGB:
        preview: !!seq
            - 1024
            - 1024
        video: !!seq
            - 2048
            - 2048
        xout:
            input: "video"
            encode: True
            time_gap: 2
    
    Mono:
        xout: False
        encode: False
        time_gap: 0
        
    Depth:
        subpixel: False
        disparity: False
    
    Segmentation:
        # path for neural net model
        blob_path: "models/segmentation_model.blob"
        # dimensions of the output from the model (width and height)
        output_dims:
            w: 64
            h: 64

